<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics — KEVA AI Learning Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="kv-shell">
  <aside class="kv-sidebar"></aside>
  <div class="kv-main">
    <header class="kv-topbar">
      <button class="kv-icon-btn kv-sidebar-toggle" style="display:none;" onclick="KevaApp.toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
      <div id="kvGlobalSearchWrap" class="kv-search" style="position:relative;">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="kvGlobalSearch" type="text" placeholder="Search...">
        <div id="kvSearchResults" class="kv-dropdown-panel kv-scroll-thin" style="width:100%;"></div>
      </div>
      <div class="kv-topbar-actions">
        <button class="kv-icon-btn" onclick="KevaApp.toggleTheme()"><i class="fa-solid fa-moon"></i></button>
        <div style="position:relative;">
          <button class="kv-icon-btn" onclick="KevaApp.toggleNotifPanel()"><i class="fa-regular fa-bell"></i><span id="kvNotifBadge" class="kv-badge-dot" style="display:none;"></span></button>
          <div id="kvNotifPanel" class="kv-dropdown-panel kv-scroll-thin"></div>
        </div>
        <div style="position:relative;">
          <div class="kv-user-pill kv-topbar-user" onclick="KevaApp.toggleUserMenu()"></div>
          <div id="kvUserMenu" class="kv-dropdown-panel" style="width:180px;">
            <div class="kv-notif-item" style="cursor:pointer;" onclick="location.href='profile.html'"><i class="fa-solid fa-user me-2"></i>My Profile</div>
            <div class="kv-notif-item" style="cursor:pointer;color:var(--kv-red);" onclick="KevaApp.logout()"><i class="fa-solid fa-right-from-bracket me-2"></i>Log Out</div>
          </div>
        </div>
      </div>
    </header>

    <main class="kv-content">
      <div class="mb-4">
        <div class="kv-eyebrow">Admin</div>
        <h1 style="font-size:24px;margin:2px 0 0;">Analytics Dashboard</h1>
      </div>

      <div class="row g-3 mb-4" id="anStats"></div>

      <div class="row g-4">
        <div class="col-lg-7">
          <div class="kv-card kv-card-pad">
            <h3 style="font-size:14.5px;margin-bottom:14px;">Weekly Activity</h3>
            <canvas id="weeklyChart" height="180"></canvas>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="kv-card kv-card-pad">
            <h3 style="font-size:14.5px;margin-bottom:14px;">Department-wise Engagement</h3>
            <canvas id="deptChart" height="220"></canvas>
          </div>
        </div>
      </div>

      <div class="kv-card mt-4">
        <div class="kv-card-header"><h3>Department Engagement Detail</h3></div>
        <div class="table-responsive">
          <table class="table mb-0" style="font-size:13px;">
            <thead style="background:var(--kv-surface-alt);">
              <tr><th class="ps-3">Department</th><th>Employees</th><th>Discussions</th><th>Polls</th><th>Votes</th></tr>
            </thead>
            <tbody id="anDeptTable"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/analytics.js"></script>
</body>
</html>
