<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — KEVA AI Learning Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="kv-shell">
  <aside class="kv-sidebar"></aside>

  <div class="kv-main">
    <header class="kv-topbar">
      <button class="kv-icon-btn kv-sidebar-toggle" style="display:none;" onclick="KevaApp.toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
      <div id="kvGlobalSearchWrap" class="kv-search" style="position:relative;">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="kvGlobalSearch" type="text" placeholder="Search employees, posters, polls, discussions...">
        <div id="kvSearchResults" class="kv-dropdown-panel kv-scroll-thin" style="width:100%;"></div>
      </div>
      <div class="kv-topbar-actions">
        <button class="kv-icon-btn" onclick="KevaApp.toggleTheme()" title="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
        <div style="position:relative;">
          <button class="kv-icon-btn" onclick="KevaApp.toggleNotifPanel()"><i class="fa-regular fa-bell"></i><span id="kvNotifBadge" class="kv-badge-dot" style="display:none;"></span></button>
          <div id="kvNotifPanel" class="kv-dropdown-panel kv-scroll-thin"></div>
        </div>
        <div style="position:relative;">
          <div class="kv-user-pill kv-topbar-user" onclick="KevaApp.toggleUserMenu()"></div>
          <div id="kvUserMenu" class="kv-dropdown-panel" style="width:180px;">
            <div class="kv-notif-item" style="cursor:pointer;" onclick="location.href='profile.html'"><i class="fa-solid fa-user me-2"></i>My Profile</div>
            <div class="kv-notif-item" style="cursor:pointer;color:var(--kv-red);" onclick="KevaApp.logout()"><i class="fa-solid fa-right-from-bracket me-2"></i>Log Out</div>
          </div>
        </div>
      </div>
    </header>

    <main class="kv-content">
      <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap gap-2">
        <div>
          <div class="kv-eyebrow" id="kvDeptEyebrow">Dashboard</div>
          <h1 style="font-size:24px;margin:2px 0 0;" id="kvGreeting">Welcome back</h1>
        </div>
        <div id="kvAdminQuickActions" class="d-flex gap-2" style="display:none !important;"></div>
      </div>

      <!-- Quick stats -->
      <div class="row g-3 mb-4" id="kvQuickStats"></div>

      <div class="row g-4">
        <div class="col-lg-8">
          <!-- Today's Poster -->
          <div class="kv-card mb-4">
            <div class="kv-card-header">
              <h3><i class="fa-solid fa-image me-2" style="color:var(--kv-primary)"></i>Today's AI Poster</h3>
              <span class="kv-ai-badge"><i class="fa-solid fa-sparkles"></i>AI Generated</span>
            </div>
            <div class="kv-card-pad" id="kvPosterArea">
              <div class="kv-skel" style="height:220px;"></div>
            </div>
          </div>

          <!-- Today's Poll -->
          <div class="kv-card mb-4">
            <div class="kv-card-header">
              <h3><i class="fa-solid fa-square-poll-vertical me-2" style="color:var(--kv-primary)"></i>Today's Poll</h3>
              <span class="kv-ai-badge"><i class="fa-solid fa-sparkles"></i>AI Generated</span>
            </div>
            <div class="kv-card-pad" id="kvPollArea">
              <div class="kv-skel" style="height:140px;"></div>
            </div>
          </div>

          <!-- Latest Discussions -->
          <div class="kv-card">
            <div class="kv-card-header">
              <h3><i class="fa-solid fa-comments me-2" style="color:var(--kv-primary)"></i>Latest Discussions</h3>
              <a class="kv-link" href="discussions.html">View all →</a>
            </div>
            <div id="kvDiscussionsArea"><div class="kv-skel m-3" style="height:120px;"></div></div>
          </div>
        </div>

        <div class="col-lg-4">
          <!-- AI Tip of the Day -->
          <div class="kv-card mb-4 kv-card-pad" style="background:linear-gradient(135deg, var(--kv-primary-light), var(--kv-signal-light));border:none;">
            <div class="kv-eyebrow signal mb-2"><i class="fa-solid fa-lightbulb"></i>AI Tip of the Day</div>
            <p style="font-size:13.5px;margin:0;" id="kvTipArea">Loading tip...</p>
          </div>

          <!-- Leaderboard -->
          <div class="kv-card mb-4">
            <div class="kv-card-header">
              <h3><i class="fa-solid fa-trophy me-2" style="color:var(--kv-amber)"></i>Leaderboard</h3>
              <a class="kv-link" href="leaderboard.html">View all →</a>
            </div>
            <div class="kv-card-pad" id="kvLeaderboardArea"><div class="kv-skel" style="height:180px;"></div></div>
          </div>

          <!-- Recent Activity -->
          <div class="kv-card">
            <div class="kv-card-header"><h3><i class="fa-solid fa-clock-rotate-left me-2"></i>Recent Activity</h3></div>
            <div class="kv-card-pad" id="kvActivityArea"><div class="kv-skel" style="height:120px;"></div></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
