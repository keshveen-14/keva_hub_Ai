<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — KEVA AI Learning Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="kv-shell">
  <aside class="kv-sidebar"></aside>
  <div class="kv-main">
    <header class="kv-topbar">
      <button class="kv-icon-btn kv-sidebar-toggle" style="display:none;" onclick="KevaApp.toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
      <div id="kvGlobalSearchWrap" class="kv-search" style="position:relative;">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="kvGlobalSearch" type="text" placeholder="Search...">
        <div id="kvSearchResults" class="kv-dropdown-panel kv-scroll-thin" style="width:100%;"></div>
      </div>
      <div class="kv-topbar-actions">
        <button class="kv-icon-btn" onclick="KevaApp.toggleTheme()"><i class="fa-solid fa-moon"></i></button>
        <div style="position:relative;">
          <button class="kv-icon-btn" onclick="KevaApp.toggleNotifPanel()"><i class="fa-regular fa-bell"></i><span id="kvNotifBadge" class="kv-badge-dot" style="display:none;"></span></button>
          <div id="kvNotifPanel" class="kv-dropdown-panel kv-scroll-thin"></div>
        </div>
        <div style="position:relative;">
          <div class="kv-user-pill kv-topbar-user" onclick="KevaApp.toggleUserMenu()"></div>
          <div id="kvUserMenu" class="kv-dropdown-panel" style="width:180px;">
            <div class="kv-notif-item" style="cursor:pointer;" onclick="location.href='profile.html'"><i class="fa-solid fa-user me-2"></i>My Profile</div>
            <div class="kv-notif-item" style="cursor:pointer;color:var(--kv-red);" onclick="KevaApp.logout()"><i class="fa-solid fa-right-from-bracket me-2"></i>Log Out</div>
          </div>
        </div>
      </div>
    </header>

    <main class="kv-content" style="max-width:900px;">
      <div class="mb-4">
        <div class="kv-eyebrow">Account</div>
        <h1 style="font-size:24px;margin:2px 0 0;">My Profile</h1>
      </div>

      <div class="row g-4">
        <div class="col-lg-4">
          <div class="kv-card kv-card-pad text-center">
            <div class="kv-avatar mx-auto mb-3" style="width:80px;height:80px;font-size:26px;" id="pfAvatar"></div>
            <div style="font-weight:800;font-size:17px;" id="pfName"></div>
            <div style="font-size:12.5px;color:var(--kv-text-muted);" id="pfDesignation"></div>
            <span class="dep-chip mt-2 d-inline-flex" id="pfDept"></span>
            <hr style="border-color:var(--kv-border);">
            <div class="row text-center">
              <div class="col-6">
                <div style="font-family:var(--kv-font-display);font-weight:800;font-size:20px;color:var(--kv-primary);" id="pfPoints">0</div>
                <div style="font-size:11px;color:var(--kv-text-muted);">Points</div>
              </div>
              <div class="col-6">
                <div style="font-family:var(--kv-font-display);font-weight:800;font-size:20px;color:var(--kv-amber);" id="pfStreak">0</div>
                <div style="font-size:11px;color:var(--kv-text-muted);">Day Streak 🔥</div>
              </div>
            </div>
          </div>

          <div class="kv-card kv-card-pad mt-4">
            <div class="kv-eyebrow mb-2"><i class="fa-solid fa-id-badge"></i>Employee Details</div>
            <div class="small" id="pfDetails" style="line-height:2;"></div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="kv-card">
            <div class="kv-card-header"><h3><i class="fa-solid fa-bookmark me-2"></i>Bookmarked Posters</h3></div>
            <div class="kv-card-pad" id="pfBookmarks"><div class="kv-skel" style="height:120px;"></div></div>
          </div>

          <div class="kv-card mt-4">
            <div class="kv-card-header"><h3><i class="fa-solid fa-award me-2"></i>Achievement Badges</h3></div>
            <div class="kv-card-pad" id="pfBadges"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
