<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discussions — KEVA AI Learning Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="kv-shell">
  <aside class="kv-sidebar"></aside>
  <div class="kv-main">
    <header class="kv-topbar">
      <button class="kv-icon-btn kv-sidebar-toggle" style="display:none;" onclick="KevaApp.toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
      <div id="kvGlobalSearchWrap" class="kv-search" style="position:relative;">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="kvGlobalSearch" type="text" placeholder="Search employees, posters, polls, discussions...">
        <div id="kvSearchResults" class="kv-dropdown-panel kv-scroll-thin" style="width:100%;"></div>
      </div>
      <div class="kv-topbar-actions">
        <button class="kv-icon-btn" onclick="KevaApp.toggleTheme()"><i class="fa-solid fa-moon"></i></button>
        <div style="position:relative;">
          <button class="kv-icon-btn" onclick="KevaApp.toggleNotifPanel()"><i class="fa-regular fa-bell"></i><span id="kvNotifBadge" class="kv-badge-dot" style="display:none;"></span></button>
          <div id="kvNotifPanel" class="kv-dropdown-panel kv-scroll-thin"></div>
        </div>
        <div style="position:relative;">
          <div class="kv-user-pill kv-topbar-user" onclick="KevaApp.toggleUserMenu()"></div>
          <div id="kvUserMenu" class="kv-dropdown-panel" style="width:180px;">
            <div class="kv-notif-item" style="cursor:pointer;" onclick="location.href='profile.html'"><i class="fa-solid fa-user me-2"></i>My Profile</div>
            <div class="kv-notif-item" style="cursor:pointer;color:var(--kv-red);" onclick="KevaApp.logout()"><i class="fa-solid fa-right-from-bracket me-2"></i>Log Out</div>
          </div>
        </div>
      </div>
    </header>

    <main class="kv-content">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
          <div class="kv-eyebrow" id="kvDeptEyebrow">Community</div>
          <h1 style="font-size:24px;margin:2px 0 0;">Discussions</h1>
        </div>
        <button class="btn btn-kv-primary" data-bs-toggle="modal" data-bs-target="#newDiscussionModal"><i class="fa-solid fa-plus me-1"></i>New Discussion</button>
      </div>

      <!-- AI discussion prompt -->
      <div class="kv-card kv-card-pad mb-4" style="background:linear-gradient(135deg, var(--kv-primary-light), var(--kv-signal-light));border:none;">
        <div class="kv-eyebrow signal mb-1"><i class="fa-solid fa-sparkles"></i>Discussion Starter</div>
        <p style="margin:0;font-size:13.5px;" id="kvQuestionArea">Loading a discussion prompt...</p>
      </div>

      <div class="kv-card">
        <div class="kv-card-header" style="border-bottom:none;padding-bottom:0;">
          <ul class="nav nav-tabs" id="sortTabs">
            <li class="nav-item"><button class="nav-link active" onclick="setSort('latest', this)">Latest</button></li>
            <li class="nav-item"><button class="nav-link" onclick="setSort('trending', this)">Trending</button></li>
            <li class="nav-item"><button class="nav-link" onclick="setSort('most_liked', this)">Most Liked</button></li>
          </ul>
        </div>
        <div id="kvDiscussionList"><div class="kv-skel m-3" style="height:300px;"></div></div>
      </div>
    </main>
  </div>
</div>

<!-- New Discussion Modal -->
<div class="modal fade" id="newDiscussionModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header" style="border-color:var(--kv-border);">
        <h5 class="modal-title">Start a Discussion</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="newDiscussionForm" onsubmit="return submitDiscussion(event)">
        <div class="modal-body">
          <div class="mb-3"><label class="kv-label">Title</label><input class="kv-form-control" id="ndTitle" required></div>
          <div class="mb-3"><label class="kv-label">Content</label><textarea class="kv-form-control" id="ndContent" rows="4" required></textarea></div>
          <div class="mb-3"><label class="kv-label">Department</label><select class="kv-form-control" id="ndDept"></select></div>
          <div class="mb-1"><label class="kv-label">Image URL (optional)</label><input class="kv-form-control" id="ndImage" placeholder="https://..."></div>
        </div>
        <div class="modal-footer" style="border-color:var(--kv-border);">
          <button type="button" class="btn btn-kv-outline" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-kv-primary">Post Discussion</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Discussion Detail Modal -->
<div class="modal fade" id="discussionDetailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header" style="border-color:var(--kv-border);">
        <h5 class="modal-title" id="ddTitle">Discussion</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="ddBody"></div>
      <div class="modal-footer" style="border-color:var(--kv-border);">
        <form class="d-flex w-100 gap-2" onsubmit="return submitComment(event)">
          <input class="kv-form-control" id="ddCommentInput" placeholder="Write a reply..." required>
          <button class="btn btn-kv-primary" type="submit">Reply</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/discussions.js"></script>
</body>
</html>
